grpc_addr: "http://[::1]:51051"
agent_name: "a-sabr"

runtime:
  source: 0
  start_time: 0
  safety_tick_secs: 10

  engine:
    max_entries: 10

  topology:
    nodes:
      - asabr_node_id: 0
        hardy_node_id: "ipn:0.1.0"
      - asabr_node_id: 1
        hardy_node_id: "ipn:1.2.0"
    contacts:
      - tx_node_id: 0
        rx_node_id: 1
        start: 0
        end: 60000
        rate: 1000000
        delay: 1000

  projection:
    bundle:
      size: 1
      priority: 0
      expiration_horizon: 3600000
    destinations:
      - pattern: "ipn:1.2.*"
        asabr_destination: 1
        route_priority: 100
