[package]
name = "cspcl"
version = "0.4.0"
edition = "2024"
description = "Rust bindings for the cspcl library"
authors = ["cspcl contributors"]
license = "MIT"
repository = "https://github.com/d3tn/cspcl"
readme = "README.md"
keywords = ["cspcl"]

[dependencies]
cspcl-sys = "0.3"
futures = { version = "0.3", features = ["alloc"] }
