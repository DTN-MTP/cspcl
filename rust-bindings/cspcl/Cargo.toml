[package]
name = "cspcl"
version = "0.5.0"
edition.workspace = true
description = "Rust bindings for the cspcl library"
authors = ["cspcl contributors"]
license = "MIT"
repository = "https://github.com/d3tn/cspcl"
readme = "README.md"
keywords = ["cspcl"]

[dependencies]
bytes = "1.12.0"
cspcl-sys = { version = "0.4", path = "../cspcl-sys" }
futures = { version = "0.3.32", features = ["alloc"] }
tokio = { version = "1.52.3", features = ["rt"] }
trace = "0.1.7"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
