name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Use docker buildkit for faster builds
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Job 1: Code formatting and style checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file formatting (no trailing whitespace, LF endings)
        run: |
          echo "Checking for trailing whitespace..."
          if grep -r '[[:blank:]]$' --include='*.c' --include='*.h' --include='*.sh' --exclude-dir=build --exclude-dir=.git .; then
            echo "ERROR: Found trailing whitespace in files above"
            exit 1
          fi
          echo "✓ No trailing whitespace found"

      - name: Check shell scripts with shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          echo "Checking shell scripts..."
          find . -type f -name "*.sh" -not -path "./build/*" | while read -r script; do
            echo "Checking $script"
            shellcheck "$script" || exit 1
          done
          echo "✓ All shell scripts passed shellcheck"

      - name: Check Python formatting with black
        uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "./tools"
          version: "~= 24.0"

      - name: Check C code formatting
        run: |
          sudo apt-get install -y clang-format
          echo "Checking C code formatting..."
          find src/ tests/ -type f \( -name "*.c" -o -name "*.h" \) | while read -r file; do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              echo "ERROR: $file needs formatting"
              echo "Run: clang-format -i $file"
              exit 1
            fi
          done
          echo "✓ C code formatting check passed"

      - name: Check Docker file best practices
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/base/Dockerfile
          failure-threshold: warning

      - name: Check for TODO/FIXME comments
        run: |
          echo "Scanning for TODO/FIXME comments..."
          grep -rn "TODO\|FIXME" src/ tests/ || echo "No TODOs found"

  # Job 2: Build and unit tests
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Add deadsnakes PPA for Python 3.11
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            python3.11 \
            python3-pip \
            git \
            libzmq3-dev \
            libsocketcan-dev

      - name: Cache libcsp
        id: cache-libcsp
        uses: actions/cache@v4
        with:
          path: /tmp/libcsp
          key: ${{ runner.os }}-libcsp-v1.6-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build libcsp v1.6
        if: steps.cache-libcsp.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          git clone --branch v1.6 --depth 1 https://github.com/libcsp/libcsp.git
          cd libcsp
          python3.11 waf configure --enable-can-socketcan --enable-if-zmqhub --with-os=posix
          python3.11 waf build

      - name: Configure CSPCL
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCSPCL_USE_SYSTEM_CSP=ON \
            -DCSP_REPO_DIR=/tmp/libcsp \
            -DCSPCL_BUILD_TESTS=ON

      - name: Build CSPCL
        run: |
          cd build
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.build_type }}
          path: build/Testing/

  # Job 3: Docker build test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cspcl-base
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push base Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test base image
        run: |
          # Pull the image we just pushed for testing
          docker pull ${{ fromJSON(steps.meta-base.outputs.json).tags[0] }}
          docker run --rm ${{ fromJSON(steps.meta-base.outputs.json).tags[0] }} bash -c "
            set -e
            echo 'Testing libcsp presence...'
            test -f /opt/libcsp/build/libcsp.a
            echo '✓ libcsp found'
            
            echo 'Testing CSPCL build...'
            test -d /opt/cspcl/build
            echo '✓ CSPCL build directory found'
            
            echo 'Testing ZMQ broker...'
            test -f /opt/tools/zmqhub_broker.py
            python3 /opt/tools/zmqhub_broker.py --help
            echo '✓ ZMQ broker working'
            
            echo 'All base image tests passed!'
          "

      - name: Extract metadata for uD3TN
        id: meta-ud3tn
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cspcl-ud3tn
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push uD3TN image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ud3tn/Dockerfile
          push: true
          tags: ${{ steps.meta-ud3tn.outputs.tags }}
          labels: ${{ steps.meta-ud3tn.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ fromJSON(steps.meta-base.outputs.json).tags[0] }}

      - name: Extract metadata for Unibo-BP
        id: meta-unibo
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cspcl-unibo
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Unibo-BP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/unibo-bp/Dockerfile
          push: true
          tags: ${{ steps.meta-unibo.outputs.tags }}
          labels: ${{ steps.meta-unibo.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ fromJSON(steps.meta-base.outputs.json).tags[0] }}
        continue-on-error: true  # May fail without Unibo-BP binaries

  # Job 4: Docker integration tests
  docker-integration-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    
    strategy:
      matrix:
        transport: [zmqhub]  # CAN requires privileged mode, may not work in all CI
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build Docker images
        run: |
          docker build -t cspcl-base:latest -f docker/base/Dockerfile .
          docker build -t cspcl-ud3tn:latest -f docker/ud3tn/Dockerfile . || echo "uD3TN build skipped"

      - name: Run uD3TN integration tests
        id: ud3tn-tests
        run: |
          cd tests/interop
          # Run with timeout to prevent hanging
          timeout 300 ./run-tests.sh --transport ${{ matrix.transport }} --test ud3tn || true
        continue-on-error: true

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p test-logs
          docker compose -f docker/docker-compose.${{ matrix.transport }}.yml logs > test-logs/compose-${{ matrix.transport }}.log 2>&1 || true
          docker ps -a > test-logs/containers.log 2>&1 || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-${{ matrix.transport }}
          path: test-logs/

      - name: Cleanup Docker
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose.${{ matrix.transport }}.yml down -v || true
          docker system prune -af || true

  # Job 5: Documentation check
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README files exist
        run: |
          echo "Checking for required documentation..."
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -f docker/README.md || { echo "Missing docker/README.md"; exit 1; }
          test -f tests/interop/README.md || { echo "Missing tests/interop/README.md"; exit 1; }
          echo "✓ All required README files present"

      - name: Check for broken markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check-config.json'
          use-quiet-mode: 'yes'
        continue-on-error: true

      - name: Check C header documentation
        run: |
          echo "Checking for function documentation in headers..."
          if ! grep -q "@brief\|@param\|@return" src/*.h; then
            echo "WARNING: Some headers may lack documentation"
          else
            echo "✓ Headers have documentation"
          fi

  # Job 6: Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 7: Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-test, docker-build, documentation, security]
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.documentation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if critical jobs failed
          if [ "${{ needs.code-quality.result }}" = "failure" ] || \
             [ "${{ needs.build-and-test.result }}" = "failure" ]; then
            echo "❌ Critical jobs failed"
            exit 1
          fi
          
          echo "✅ CI pipeline completed"
