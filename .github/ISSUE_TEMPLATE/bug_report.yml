name: Bug Report
description: Report a bug or unexpected behavior in CSPCL
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Initialize CSPCL with `cspcl_init(...)`
        2. Call `cspcl_send(...)`
        3. Observe crash / wrong behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages or logs.
    validations:
      required: true

  - type: input
    id: cspcl-version
    attributes:
      label: CSPCL Version
      placeholder: "e.g. 1.0.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: libcsp-version
    attributes:
      label: libcsp Version
      placeholder: "e.g. 1.6.x or 'stubs'"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Ubuntu 24.04, FreeRTOS"
    validations:
      required: true

  - type: textarea
    id: cmake-version
    attributes:
      label: CMake / Compiler Version
      description: Output of `cmake --version` and `gcc --version` (or equivalent).
    validations:
      required: false
