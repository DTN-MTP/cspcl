version: '3.8'

services:
  # ZMQ Hub Broker - Routes CSP packets between nodes
  zmq-broker:
    image: cspcl-base:latest
    container_name: cspcl-zmq-broker
    command: python3 /opt/tools/zmqhub_broker.py -v
    ports:
      - "6000:6000"
      - "7000:7000"
    networks:
      - csp-zmq-net
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 6000 && nc -z localhost 7000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # uD3TN Node A (CSP address 1)
  ud3tn-node-a:
    image: cspcl-ud3tn:latest
    container_name: cspcl-ud3tn-node-a
    build:
      context: ..
      dockerfile: docker/ud3tn/Dockerfile
    depends_on:
      zmq-broker:
        condition: service_healthy
    environment:
      - CSP_ADDR=1
      - CSP_PORT=10
      - TRANSPORT=zmqhub
      - UD3TN_EID=dtn://a.dtn/
      - ZMQ_BROKER_HOST=zmq-broker
    networks:
      - csp-zmq-net
    volumes:
      - ud3tn-a-data:/var/run/ud3tn
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f ud3tn"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # uD3TN Node B (CSP address 2)
  ud3tn-node-b:
    image: cspcl-ud3tn:latest
    container_name: cspcl-ud3tn-node-b
    build:
      context: ..
      dockerfile: docker/ud3tn/Dockerfile
    depends_on:
      zmq-broker:
        condition: service_healthy
    environment:
      - CSP_ADDR=2
      - CSP_PORT=10
      - TRANSPORT=zmqhub
      - UD3TN_EID=dtn://b.dtn/
      - ZMQ_BROKER_HOST=zmq-broker
    networks:
      - csp-zmq-net
    volumes:
      - ud3tn-b-data:/var/run/ud3tn
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f ud3tn"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Unibo-BP Node 1 (CSP address 3)
  unibo-node-1:
    image: cspcl-unibo:latest
    container_name: cspcl-unibo-node-1
    build:
      context: ..
      dockerfile: docker/unibo-bp/Dockerfile
    depends_on:
      zmq-broker:
        condition: service_healthy
    environment:
      - CSP_ADDR=3
      - CSP_PORT=10
      - TRANSPORT=zmqhub
      - UNIBO_SOCKET=2001
      - UNIBO_NODE_DIR=/tmp/unibo-node1
      - UNIBO_ADMIN_EID=ipn:3.0
      - UNIBO_ADMIN_DTN_EID=dtn://c.dtn/
      - ZMQ_BROKER_HOST=zmq-broker
    networks:
      - csp-zmq-net
    volumes:
      - unibo-1-data:/tmp/unibo-node1
      # Mount Unibo-BP binaries if available on host
      # - /path/to/unibo-bp/bin:/opt/unibo-bp/bin:ro
      # - /path/to/unibo-bp/lib:/opt/unibo-bp/lib:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'unibo-bp-cspcl|unibo-bp'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Unibo-BP Node 2 (CSP address 4)
  unibo-node-2:
    image: cspcl-unibo:latest
    container_name: cspcl-unibo-node-2
    build:
      context: ..
      dockerfile: docker/unibo-bp/Dockerfile
    depends_on:
      zmq-broker:
        condition: service_healthy
    environment:
      - CSP_ADDR=4
      - CSP_PORT=10
      - TRANSPORT=zmqhub
      - UNIBO_SOCKET=2002
      - UNIBO_NODE_DIR=/tmp/unibo-node2
      - UNIBO_ADMIN_EID=ipn:4.0
      - UNIBO_ADMIN_DTN_EID=dtn://d.dtn/
      - ZMQ_BROKER_HOST=zmq-broker
    networks:
      - csp-zmq-net
    volumes:
      - unibo-2-data:/tmp/unibo-node2
      # Mount Unibo-BP binaries if available on host
      # - /path/to/unibo-bp/bin:/opt/unibo-bp/bin:ro
      # - /path/to/unibo-bp/lib:/opt/unibo-bp/lib:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'unibo-bp-cspcl|unibo-bp'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  csp-zmq-net:
    driver: bridge
    name: cspcl-zmqhub-network

volumes:
  ud3tn-a-data:
  ud3tn-b-data:
  unibo-1-data:
  unibo-2-data:
